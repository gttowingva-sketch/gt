name: Apply and verify V8 preview
on:
  push:
    branches: [refined-v8-preview-20260930]
    paths: [.github/workflows/apply-refined-v8.yml]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refined-v8-preview-20260930
      - name: Retrieve exact revision bundle
        env:
          SOURCE: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-9778-81f5-ab1b-640e3acfd25b/raw?se=2026-09-30T19%3A56%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=a69554a9-2f83-53b2-bdaf-691f0b0e67a5&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T17%3A28%3A10Z&ske=2026-10-01T17%3A28%3A10Z&sks=b&skv=2026-02-06&sig=%2BNce7Fzx1%2BxQOiMN4PVIgCcaqXvRr%2BPvRJHZk5zHsdk%3D'
        run: |
          python - <<'PY'
          import urllib.request,os,hashlib,zipfile,io,pathlib
          b=urllib.request.urlopen(os.environ['SOURCE'],timeout=45).read()
          assert len(b)==477777 and hashlib.sha256(b).hexdigest()=='4c3e4d71a7da32b6e025e2882de28b05156b43e104182194ddf368d5defcac51'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            for name in z.namelist():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
            z.extractall('.')
          PY
      - name: Prepare clean artwork and optical logo sizes
        run: |
          python -m pip install --quiet pillow cairosvg numpy opencv-contrib-python-headless
          python prepare-refinement-assets.py | tee v8-assets-verification.txt
      - name: Build the actual page
        run: |
          node refinement-build.mjs
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('vercel.json');v=json.loads(p.read_text());v['buildCommand']='node refinement-build.mjs';v['outputDirectory']='dist';p.write_text(json.dumps(v,indent=2)+'\n')
          PY
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check images, section positions and real interactions
        shell: bash
        run: |
          set -eo pipefail
          cat > v8-qa.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import http from 'node:http';
          import path from 'node:path';
          const server=http.createServer(async(req,res)=>{try{const u=decodeURIComponent(new URL(req.url,'http://localhost').pathname);const file=path.join(process.cwd(),'dist',u==='/'?'index.html':u);const b=await fs.readFile(file);const ext=path.extname(file);const types={'.html':'text/html','.svg':'image/svg+xml','.webp':'image/webp','.jpg':'image/jpeg','.png':'image/png','.avif':'image/avif'};res.setHeader('Content-Type',types[ext]||'application/octet-stream');res.end(b);}catch(e){res.statusCode=404;res.end('Not found');}});
          await new Promise(r=>server.listen(8091,'127.0.0.1',r));await fs.mkdir('v8-checks',{recursive:true});
          const browser=await chromium.launch({headless:true});const records=[];
          try{
            for(const width of [390,768,1440,1920]){
              const page=await browser.newPage({viewport:{width,height:1000},reducedMotion:'reduce'});const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:8091/',{waitUntil:'load'});
              await page.evaluate(async()=>{document.querySelectorAll('img').forEach(i=>i.loading='eager');await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));});
              const stats=await page.evaluate(()=>{const rect=s=>{let r=document.querySelector(s).getBoundingClientRect();return{x:r.x,width:r.width,height:r.height}};return{width:innerWidth,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),broken:[...document.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src),logos:document.querySelectorAll('.network-logo img').length,stages:[...document.querySelectorAll('.motion-stage')].map(e=>({w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height})),flag:document.querySelector('.mission-flag').textContent,processSoldier:!!document.querySelector('.process-section .process-art img'),aboutWarehouse:!!document.querySelector('#about .about-backdrop img'),oldAboutVisual:!!document.querySelector('#about .about-visual'),mission:rect('.mission'),government:rect('#government .government-intro'),sectionOrder:[...document.querySelectorAll('main>section')].map(s=>s.id||s.className)}});
              if(stats.overflow>1||stats.broken.length||stats.logos!==10||stats.flag.includes('MISSION READY')||!stats.processSoldier||!stats.aboutWarehouse||stats.oldAboutVisual||errors.length)throw Error(JSON.stringify({stats,errors}));
              const reference=stats.stages[1];if(stats.stages.some(s=>Math.abs(s.w-reference.w)>1||Math.abs(s.h-reference.h)>1))throw Error('Motion canvas sizes differ');
              await page.locator('[data-video="870918"]').click();await page.waitForSelector('#video-stage iframe');stats.video=await page.locator('#video-stage iframe').getAttribute('src');await page.locator('#video-dialog [data-close-dialog]').click();await page.waitForFunction(()=>!document.querySelector('#video-stage iframe'));
              await page.locator('[data-detail="matching"]').last().click();await page.waitForSelector('#detail-dialog[open]');await page.locator('#detail-dialog [data-close-dialog]').click();
              if(width<760){await page.locator('.nav-toggle').click();await page.waitForTimeout(80);await page.locator('.nav-toggle').click();}
              await page.evaluate(()=>{document.querySelectorAll('.reveal').forEach(e=>{e.style.opacity=1;e.style.transform='none'});});
              if(width===1920){for(const [name,sel] of [['mission','.mission'],['motion','#capabilities-motion'],['network','#manufacturer-network'],['process','.process-section'],['about','#about'],['government','#government']]){await page.locator(sel).screenshot({path:`v8-checks/${name}.jpg`,type:'jpeg',quality:85,timeout:20000});}}
              if(width===390)await page.screenshot({path:'v8-checks/mobile.jpg',fullPage:true,type:'jpeg',quality:75});
              records.push(stats);await page.close();
            }
            await fs.writeFile('v8-checks/qa.json',JSON.stringify({revision:'refined-v8-20260930',passed:true,records},null,2));console.log('V8_BROWSER_QA_PASSED',JSON.stringify(records));
          }finally{await browser.close();server.close();}
          JS
          node v8-qa.mjs | tee v8-browser-verification.txt
      - name: Save preview files without changing main or V7
        if: always()
        run: |
          test "$(git branch --show-current)" = refined-v8-preview-20260930
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in refinement.css refinement-build.mjs prepare-refinement-assets.py revision-assets vercel.json v8-assets-verification.txt v8-browser-verification.txt v8-qa.mjs v8-checks; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then git commit -m 'Refine approved HTML: seamless artwork, complete media, balanced logos and larger icons (preview only)'; git push origin HEAD:refined-v8-preview-20260930; fi
