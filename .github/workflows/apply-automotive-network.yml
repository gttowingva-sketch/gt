name: Apply approved Automotive partner band
on:
  push:
    branches: [automotive-network-20261002]
    paths: [.github/workflows/apply-automotive-network.yml]
permissions:
  contents: write
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automotive-network-20261002
      - name: Decode and verify approved repository asset bundle
        run: |
          python - <<'PY'
          import base64,hashlib,zipfile,io,pathlib
          expected=['fada057874820225165d562a93369237bf905c48537a1b4f455314b4e0623657','f189f6e5430f3bc1c293347811376a1fab4ecbf25ae8c27411ed0016daa1be5a','146873d9b3b8a8fc0bab30fdd6bda7ef5cc9a95a430c01b6fc828ad79962fe6e','a3ee38b958bb676c62be2ec407727ea2ee86f720da8ef922d27db032ee514e3a','c1ebeacfe0322fc2e9e05b3d20575feae53c84e55b263d06cef9d2fe367e1a41','af359a0a03c8b6039046cd8074af419009ef190ac9954f69938e95afac4019e4','f9d5fa22724b30db23f2972d3d1fc21b0eb225d2b0cb32f8c3fb85dad47b4232','23065948226868f151bafc5563de946fb01d48ba717fed62615cde6ac527770f','c715923ae627509ce1c9706bb1003a1ccd6708833e69b9a77e53372dfdc55e2e','8226e78e4b62a974cd834ce13cba90486b9a48412ee38c6e767bb12835868b08','96dfe6d4904673f47c217872b0b033abb229f5443d699adacb4fdc5fc8c054f8']
          chunks=[]
          for i,checksum in enumerate(expected):
            p=pathlib.Path(f'automotive-network-transfer/payload{i:02}.b64');s=p.read_text().strip()
            actual=hashlib.sha256(s.encode()).hexdigest();assert actual==checksum,(p.name,actual,checksum)
            chunks.append(s)
          b=base64.b64decode(''.join(chunks),validate=True)
          assert len(b)==19141 and hashlib.sha256(b).hexdigest()=='f26403c63d3b39539ce9481b185463d7d44991724e724581610fe018d1d4f8ad'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            for name in z.namelist():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith('automotive-network')
            z.extractall('.')
          print('APPROVED_BUNDLE_VERIFIED',len(b))
          PY
      - name: Build existing site plus one isolated band
        run: |
          node --check automotive-network-build.mjs
          node automotive-network-build.mjs
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('vercel.json');v=json.loads(p.read_text());assert v['buildCommand']=='node refinement-build.mjs';v['buildCommand']='node automotive-network-build.mjs';p.write_text(json.dumps(v,indent=2)+'\n')
          PY
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test actual HTML on five viewport widths
        run: node automotive-network-qa.mjs
      - name: Save only the approved band and verification
        run: |
          test "$(git branch --show-current)" = automotive-network-20261002
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automotive-network.html automotive-network.css automotive-network-build.mjs automotive-network-qa.mjs automotive-network-manifest.json automotive-network-assets automotive-network-checks vercel.json
          git rm -r automotive-network-transfer
          git rm -f automotive-network-transfer.part0 .github/workflows/apply-automotive-network.yml
          git commit -m 'Add approved Automotive partner network between Automotive and Government Supply; preserve all existing sections'
          git push origin HEAD:automotive-network-20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automotive-network-browser-checks
          path: automotive-network-checks
          if-no-files-found: ignore
