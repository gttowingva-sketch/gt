name: Build MR.WHEELS polish preview
on:
  push:
    branches: [site-polish-preview-20260930]
    paths: [.github/workflows/site-polish-preview.yml]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-polish-preview-20260930
      - name: Apply approved visual changes
        shell: bash
        env:
          SOLDIER_B64: "<br/>...TRUNCATED..."
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, os
          p=Path("index.html")
          h=p.read_text(encoding="utf-8")

          # Hero: use the wider existing asset so multiple vehicles read clearly again.
          h=re.sub(r'(<img\b(?=[^>]*\bid="lead-image")[^>]*\bsrc=")[^"]+(")', r'\1hero-military-vehicles-v2.webp\2', h, count=1)

          # Manufacturer / sourcing network band.
          if 'manufacturer-network-band' not in h:
              band='''<section class="manufacturer-network-band" aria-label="Manufacturer and sourcing network">
              <div class="manufacturer-network-inner">
                <div class="network-copy">
                  <p class="eyebrow"><span></span>MANUFACTURER &amp; SOURCING NETWORK</p>
                  <h2>Stronger together.</h2>
                  <p>Representative manufacturers across the markets and product families we source.</p>
                </div>
                <div class="network-logos" aria-label="Representative manufacturers">
                  <span>CATERPILLAR</span><span>BOSCH</span><span>ZF</span><span>TIMKEN</span><span>DENSO</span>
                  <span>CUMMINS</span><span>LOCKHEED MARTIN</span><span>BOEING</span><span>ROLLS-ROYCE</span><span>GENERAL DYNAMICS</span>
                </div>
                <a class="network-cta" href="#suppliers">PARTNER WITH US <b>→</b></a>
              </div>
              <p class="network-disclosure">Manufacturer names are shown for sourcing context only and do not imply endorsement or formal partnership. Availability and authorization vary by requirement.</p>
              </section>'''
              m=re.search(r'<section\b[^>]*id="supply-categories"[^>]*>', h, re.I)
              if not m: raise SystemExit("supply-categories section not found")
              h=h[:m.start()]+band+h[m.start():]

          # About: add the approved soldier / sunset visual as a cinematic closing panel.
          if 'about-mission-visual' not in h:
              visual='''<div class="about-mission-visual">
                <img src="about-mission-soldier.jpg" alt="Mission readiness visual with quality, accountability and global impact themes">
              </div>'''
              m=re.search(r'(<section\b[^>]*id="about"[^>]*>.*?)(</section>)', h, re.I|re.S)
              if not m: raise SystemExit("about section not found")
              h=h[:m.start(2)]+visual+h[m.start(2):]

          css=r'''
          <style id="polish-preview-20260930">
          /* Approved balance pass — preview only */
          .hero-art img{
            object-fit:cover!important;
            object-position:52% center!important;
            transform:none!important;
            filter:brightness(.74) saturate(.86)!important;
          }

          /* Upper cinematic blocks and their card grids share one exact visual axis. */
          .automotive .service-intro,
          .government .government-intro{
            width:min(calc(100% - 80px),1560px)!important;
            margin-inline:auto!important;
            border-inline:1px solid rgba(255,255,255,.045);
          }
          .automotive .service-intro .container,
          .government .government-intro .container,
          .automotive > .container,
          .government > .container{
            width:100%!important;
            max-width:1560px!important;
            margin-inline:auto!important;
            padding-inline:0!important;
          }
          .automotive > .container,
          .government > .container{
            width:min(calc(100% - 80px),1560px)!important;
          }
          .government-intro + .container{margin-top:0!important}
          .government-trust{margin-top:0!important}

          /* Precision Manufacturing thumbnail: show the full mark before play. */
          .motion-card:nth-child(2) .motion-media{
            background:#eef0f2!important;
          }
          .motion-card:nth-child(2) .motion-media img,
          .motion-card:nth-child(2) .motion-media .motion-cover,
          .motion-card:nth-child(2) .motion-media .card-photo{
            object-fit:contain!important;
            object-position:center center!important;
            transform:scale(.76)!important;
            filter:brightness(.88) saturate(.8)!important;
          }

          .manufacturer-network-band{
            background:
              radial-gradient(circle at 66% 50%,rgba(255,124,38,.07),transparent 28%),
              linear-gradient(120deg,#0a0f13,#080c0f 58%,#0b1116);
            border-block:1px solid rgba(224,234,240,.11);
            padding:42px max(40px,5vw) 24px;
            overflow:hidden;
          }
          .manufacturer-network-inner{
            width:min(100%,1560px);margin:0 auto;
            display:grid;grid-template-columns:minmax(250px,.75fr) minmax(0,2.15fr) auto;
            gap:34px;align-items:center;
          }
          .network-copy .eyebrow{margin:0 0 7px;color:#b8c1c8;font-size:9px}
          .network-copy h2{font-size:clamp(25px,2vw,34px);margin:0;color:#f4f6f7}
          .network-copy>p:last-child{font-size:12px;line-height:1.55;margin-top:8px;max-width:330px}
          .network-logos{
            display:flex;align-items:center;gap:clamp(16px,1.6vw,28px);
            overflow:hidden;white-space:nowrap;min-width:0;
            color:#c8ced3;opacity:.83;
          }
          .network-logos span{
            font-size:clamp(11px,.82vw,14px);font-weight:800;letter-spacing:.045em;
            flex:0 0 auto;filter:grayscale(1);
          }
          .network-logos span:nth-child(3){font-size:23px}
          .network-cta{
            display:inline-flex;align-items:center;gap:14px;border:1px solid var(--accent);
            border-radius:30px;padding:12px 20px;font-size:10px;font-weight:800;
            letter-spacing:.08em;white-space:nowrap;
          }
          .network-cta b{color:var(--accent);font-size:18px;font-weight:400}
          .network-disclosure{
            width:min(100%,1560px);margin:18px auto 0;padding-top:14px;
            border-top:1px solid rgba(224,234,240,.07);
            font-size:9px;line-height:1.6;color:#68747d;
          }

          .about-mission-visual{
            width:min(calc(100% - var(--gutter)*2),1560px);
            margin:46px auto 0;border:1px solid rgba(255,255,255,.11);
            border-radius:5px;overflow:hidden;position:relative;background:#090d10;
          }
          .about-mission-visual:after{
            content:"";position:absolute;inset:0;
            background:linear-gradient(90deg,rgba(5,8,10,.04),rgba(5,8,10,.1) 58%,rgba(5,8,10,.25));
            pointer-events:none;
          }
          .about-mission-visual img{
            width:100%;height:auto;max-height:360px;object-fit:cover;object-position:center;
            display:block;filter:saturate(.83) contrast(1.04) brightness(.82);
          }

          @media(max-width:1100px){
            .manufacturer-network-inner{grid-template-columns:1fr;gap:20px}
            .network-logos{overflow-x:auto;padding-bottom:6px}
            .network-cta{justify-self:start}
          }
          @media(max-width:700px){
            .automotive .service-intro,.government .government-intro,
            .automotive > .container,.government > .container{
              width:min(calc(100% - 28px),1560px)!important;
            }
            .manufacturer-network-band{padding-inline:22px}
            .about-mission-visual{width:calc(100% - 44px);margin-top:30px}
            .about-mission-visual img{min-height:210px;object-fit:cover}
          }
          </style>'''
          if 'id="polish-preview-20260930"' not in h:
              h=h.replace('</head>',css+'</head>',1)

          p.write_text(h,encoding="utf-8")
          Path("about-mission-soldier.jpg").write_bytes(base64.b64decode(os.environ["SOLDIER_B64"]))
          PY
      - name: Commit preview changes
        shell: bash
        run: |
          git config user.name "gttowingva-sketch"
          git config user.email "gttowingva@gmail.com"
          git add index.html about-mission-soldier.jpg
          git commit -m "Preview: balance sections, restore wide hero, add sourcing network and About mission visual"
          git push origin HEAD:site-polish-preview-20260930
